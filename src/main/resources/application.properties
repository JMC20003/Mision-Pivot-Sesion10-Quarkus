quarkus.http.port=8082

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres

quarkus.hibernate-orm.database.generation=update

exchange-rate.daily-query-limit=10

quarkus.rest-client.api-proxy.url=https://free.e-api.net.pe
quarkus.rest-client.api-proxy.connect-timeout=5000
quarkus.rest-client.api-proxy.read-timeout=5000


quarkus.tls.exchange-rate.trust-all=true
quarkus.rest-client.api-proxy.tls-configuration-name=exchange-rate